<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recite Quran - Arab + TTS Terjemahan PASTI BUNYI</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#fff;color:#111}
.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:20}.top-in{max-width:920px;margin:auto;display:flex;gap:8px;padding:12px 14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px}.logo span{color:#0e7a55}.spacer{flex:1}
select,input{padding:10px;border:1px solid #e5e5e5;border-radius:10px;background:#fafafa;font-size:14px}
.btn{border:1px solid #e5e5e5;background:#fff;padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:600}.btn.primary{background:#0e7a55;color:#fff;border-color:#0e7a55}.btn.stop{background:#dc2626;color:#fff;border-color:#dc2626}.btn.test{background:#f59e0b;color:#fff;border-color:#f59e0b}
.wrap{max-width:780px;margin:auto;padding:16px 14px 140px}
.panel{background:#f0faf5;border:1px solid #c8e8d5;border-radius:18px;padding:16px;margin:14px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row label{font-size:13px;color:#555}
.verse-card{border:1px solid #eee;border-radius:18px;padding:18px;margin:12px 0}.verse-card.playing{border:2px solid #0e7a55;background:#f0faf5}
.arab{font-family:'Amiri Quran',serif;font-size:40px;line-height:1.9;text-align:right;direction:rtl}.trans{text-align:center;line-height:1.7;color:#444}
.badge{display:inline-block;background:#eaf6f0;color:#0e7a55;padding:5px 11px;border-radius:999px;font-weight:700;font-size:13px}
.player{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;z-index:30}.player-in{max-width:920px;margin:auto;display:flex;gap:10px;padding:12px 14px;align-items:center;flex-wrap:wrap}.player-in audio{flex:1;min-width:160px;height:36px;filter:invert(1)}.status{font-size:13px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.surah{border:1px solid #eee;padding:12px;border-radius:14px;cursor:pointer}
.debug{background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
</style></head><body>
<div class="top"><div class="top-in"><div class="logo">Recite<span>Quran</span> <small style="font-weight:400;color:#888">Arab → Terjemahan Bunyi</small></div><div class="spacer"></div>
<select id="qari"><option value="ar.alafasy">Mishary Alafasy</option><option value="ar.abdulrahmanalsudais">Al-Sudais</option><option value="ar.mahermualaiqly">Maher Al-Muaiqly</option></select>
</div></div>
<div class="wrap">
<h1 id="surahName" style="text-align:center;margin:6px 0">Al-Fatihah</h1>
<p style="text-align:center;color:#888;margin:0">Pola: 🔊 Arab → 🗣️ Terjemahan Indonesia → 🔊 Ayat Berikutnya</p>

<div class="panel">
<h3 style="margin:0 0 10px">▶ AUTOPLAY</h3>
<div class="row"><label>Mode:</label><select id="mode" onchange="changeMode()"><option value="range">Dari Ayat ke Ayat</option><option value="juz">Per Juz</option><option value="surah">1 Surah Penuh</option></select></div>
<div id="box-range"><div class="row"><label>Dari:</label><input id="from" value="1:3" style="width:90px"><label>Sampai:</label><input id="to" value="1:7" style="width:90px"></div></div>
<div id="box-juz" style="display:none"><div class="row"><label>Juz:</label><select id="juzSel"></select></div></div>
<div id="box-surah" style="display:none"><div class="row"><label>Surah:</label><select id="surahSel" style="flex:1"></select></div></div>
<div class="row"><label>Terjemahan:</label><select id="ttsMode"><option value="auto" selected>Auto - Coba Google, kalau gagal pakai Suara HP</option><option value="hp">Pakai Suara HP saja (Paling Aman)</option><option value="google">Pakai Google TTS saja</option></select></div>
<div class="row">
<button class="btn test" onclick="testTTS()">🔊 TES SUARA TERJEMAHAN</button>
<button class="btn primary" id="playBtn" onclick="startAutoplay()" style="flex:1">▶ MULAI AUTOPLAY</button>
<button class="btn stop" onclick="stopAll()">⏹ STOP</button>
</div>
<div class="debug" id="debug">Status: Siap. Tekan <b>TES SUARA TERJEMAHAN</b> dulu. Kalau bunyi "Yang Maha Pengasih", berarti sudah benar.</div>
<div class="row"><span id="queueInfo" style="font-size:13px;color:#555"></span></div>
</div>
<div id="content"><p style="text-align:center;padding:30px">Memuat...</p></div>
<h3>Semua Surah</h3><input id="search" placeholder="Cari Yasin..." style="width:100%;margin-bottom:10px" oninput="filterSurah(this.value)"><div class="list" id="surahList"></div>
</div>
<div class="player"><div class="player-in"><button class="btn primary" onclick="startAutoplay()">▶ Play</button><span class="status" id="status">Siap</span
