<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recite Quran - Autoplay Ayat / Juz</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#fff;color:#111}
.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:20}.top-in{max-width:920px;margin:auto;display:flex;gap:8px;padding:12px 14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px}.logo span{color:#0e7a55}.spacer{flex:1}
select,input{padding:10px;border:1px solid #e5e5e5;border-radius:10px;background:#fafafa;font-size:14px}
.btn{border:1px solid #e5e5e5;background:#fff;padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:600}.btn.primary{background:#0e7a55;color:#fff;border-color:#0e7a55}.btn.stop{background:#dc2626;color:#fff;border-color:#dc2626}
.wrap{max-width:780px;margin:auto;padding:16px 14px 140px}
.panel{background:#f0faf5;border:1px solid #c8e8d5;border-radius:18px;padding:16px;margin:14px 0}
.panel h3{margin:0 0 10px;font-size:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row label{font-size:13px;color:#555}
.verse-card{border:1px solid #eee;border-radius:18px;padding:18px;margin:12px 0}.verse-card.playing{border:2px solid #0e7a55;background:#f0faf5}
.arab{font-family:'Amiri Quran',serif;font-size:40px;line-height:1.9;text-align:right;direction:rtl}.trans{text-align:center;line-height:1.7;color:#444}
.badge{display:inline-block;background:#eaf6f0;color:#0e7a55;padding:5px 11px;border-radius:999px;font-weight:700;font-size:13px}
.player{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;z-index:30}.player-in{max-width:920px;margin:auto;display:flex;gap:10px;padding:12px 14px;align-items:center;flex-wrap:wrap}.player-in audio{flex:1;min-width:160px;height:36px;filter:invert(1)}.status{font-size:13px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.surah{border:1px solid #eee;padding:12px;border-radius:14px;cursor:pointer}
</style></head><body>
<div class="top"><div class="top-in"><div class="logo">Recite<span>Quran</span> <small style="font-weight:400;color:#888">Autoplay Ayat / Juz</small></div><div class="spacer"></div>
<select id="qari"><option value="ar.alafasy">Mishary Alafasy</option><option value="ar.abdulrahmanalsudais">Al-Sudais</option><option value="ar.mahermualaiqly">Maher Al-Muaiqly</option><option value="ar.abdullahawadaljuhany">Al-Juhany</option></select>
</div></div>

<div class="wrap">
<h1 id="surahName" style="text-align:center;margin:6px 0">Al-Fatihah - الفاتحة</h1>
<p id="surahMeta" style="text-align:center;color:#888;margin:0">Pilih mode autoplay di bawah</p>

<div class="panel">
<h3>▶ AUTOPLAY TERUS - Arab ↔ Terjemahan Suara</h3>
<div class="row">
<label>Mode:</label>
<select id="mode" onchange="changeMode()">
<option value="range">Dari Ayat ke Ayat</option>
<option value="juz">Per Juz</option>
<option value="surah">1 Surah Penuh</option>
</select>
</div>

<!-- MODE RANGE -->
<div id="box-range">
<div class="row"><label>Dari:</label><input id="from" value="1:3" style="width:90px"><label>Sampai:</label><input id="to" value="1:7" style="width:90px"><span style="font-size:12px;color:#888">Contoh: 1:3 sampai 2:5 = nyebrang surah bisa</span></div>
</div>

<!-- MODE JUZ -->
<div id="box-juz" style="display:none">
<div class="row"><label>Juz:</label><select id="juzSel"></select><span id="juzInfo" style="font-size:13px;color:#0e7a55"></span></div>
</div>

<!-- MODE SURAH -->
<div id="box-surah" style="display:none">
<div class="row"><label>Surah:</label><select id="surahSel" style="flex:1"></select></div>
</div>

<div class="row">
<label>Terjemahan Suara:</label><select id="withTrans"><option value="1" selected>ON - Arab → Indonesia → Arab → Indonesia...</option><option value="0">OFF - Arab saja</option></select>
<label>Kecepatan Terjemahan:</label><select id="ttsRate"><option value="0.9">Pelan</option><option value="1.1" selected>Normal</option><option value="1.4">Cepat</option></select>
<label>Ulangi:</label><select id="loopMode"><option value="1">1x</option><option value="2">2x per ayat</option><option value="0">Loop terus sampai Stop</option></select>
</div>

<div class="row">
<button class="btn primary" id="playBtn" onclick="startAutoplay()" style="flex:1">▶ MULAI AUTOPLAY</button>
<button class="btn stop" onclick="stopAll()">⏹ STOP</button>
</div>
<div class="row"><span id="queueInfo" style="font-size:13px;color:#555"></span></div>
</div>

<div id="content"><p style="text-align:center;padding:30px">Pilih mode di atas, lalu tekan MULAI AUTOPLAY...</p></div>

<h3>Semua Surah - Klik untuk lihat</h3>
<input id="search" placeholder="Cari Yasin, Al-Kahf..." style="width:100%;margin-bottom:10px" oninput="filterSurah(this.value)">
<div class="list" id="surahList"></div>
</div>

<div class="player"><div class="player-in"><button class="btn primary" onclick="startAutoplay()">▶ Play</button><span class="status" id="status">Siap</span><audio id="audio" controls></audio></div></div>

<script>
// Juz 1-30 : [surah, ayat] mulai
const JUZ_START=[[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];
const JUZ_END=[[2,141],[2,252],[3,92],[4,23],[4,147],[5,81],[6,110],[7,87],[8,40],[9,92],[11,5],[12,52],[14,52],[16,128],[18,74],[20,135],[22,78],[25,20],[27,55],[29,45],[33,30],[36,27],[39,31],[41,46],[45,37],[51,30],[57,29],[66,12],[77,50],[114,6]];
let allSurah=[], isPlaying=false, cache={};
let curSurah=1;

async function init(){
  const r=await fetch('https://api.alquran.cloud/v1/surah').then(r=>r.json()); allSurah=r.data;
  document.getElementById('surahSel').innerHTML=allSurah.map(s=>`<option value="${s.number}">${s.number}. ${s.englishName} (${s.numberOfAyahs} ayat)</option>`).join('');
  document.getElementById('surahSel').onchange=e=>{curSurah=+e.target.value; showSurah(curSurah);};
  document.getElementById('surahList').innerHTML=allSurah.map(s=>`<div class="surah" onclick="showSurah(${s.number})"><b>${s.number}. ${s.englishName}</b><br><span>${s.numberOfAyahs} ayat</span></div>`).join('');
  document.getElementById('juzSel').innerHTML=JUZ_START.map((j,i)=>`<option value="${i+1}">Juz ${i+1} - Mulai ${j[0]}:${j[1]} sampai ${JUZ_END[i][0]}:${JUZ_END[i][1]}</option>`).join('');
  document.getElementById('juzSel').onchange=()=>updateJuzInfo();
  updateJuzInfo(); showSurah(1);
}
function updateJuzInfo(){const j=+document.getElementById('juzSel').value; document.getElementById('juzInfo').textContent=`Juz ${j}: ${JUZ_START[j-1][0]}:${JUZ_START[j-1][1]} → ${JUZ_END[j-1][0]}:${JUZ_END[j-1][1]}`;}
function changeMode(){const m=document.getElementById('mode').value; document.getElementById('box-range').style.display=m=='range'?'block':'none'; document.getElementById('box-juz').style.display=m=='juz'?'block':'none'; document.getElementById('box-surah').style.display=m=='surah'?'block':'none';}
function filterSurah(q){q=q.toLowerCase(); document.querySelectorAll('.surah').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'block':'none');}

function parseKey(k){const [s,a]=k.split(':').map(Number); return {s,a};}
function buildQueue(){
  const mode=document.getElementById('mode').value;
  let start,end;
  if(mode=='range'){ start=parseKey(document.getElementById('from').value.trim()||'1:3'); end=parseKey(document.getElementById('to').value.trim()||'1:7'); }
  else if(mode=='juz'){ const j=+document.getElementById('juzSel').value; start={s:JUZ_START[j-1][0],a:JUZ_START[j-1][1]}; end={s:JUZ_END[j-1][0],a:JUZ_END[j-1][1]}; }
  else { const s=+document.getElementById('surahSel').value; start={s,a:1}; end={s,a:allSurah.find(x=>x.number==s).numberOfAyahs}; }
  // validasi
  if(start.s>end.s || (start.s==end.s && start.a>end.a)){ alert('Dari harus lebih kecil dari Sampai!'); return []; }
  let q=[]; for(let s=start.s;s<=end.s;s++){ let a1=(s==start.s?start.a:1); let a2=(s==end.s?end.a:allSurah.find(x=>x.number==s).numberOfAyahs); for(let a=a1;a<=a2;a++) q.push({s,a}); }
  return q;
}

async function getSurahData(s){
  if(cache[s]) return cache[s];
  const [arab,indo,audio]=await Promise.all([
    fetch(`https://api.alquran.cloud/v1/surah/${s}`).then(r=>r.json()),
    fetch(`https://api.alquran.cloud/v1/surah/${s}/id.indonesian`).then(r=>r.json()),
    fetch(`https://api.alquran.cloud/v1/surah/${s}/${document.getElementById('qari').value}`).then(r=>r.json())
  ]);
  cache[s]={arab:arab.data, indo:indo.data, audio:audio.data};
  return cache[s];
}

async function showSurah(s){
  curSurah=s; document.getElementById('surahSel').value=s;
  const d=await getSurahData(s);
  document.getElementById('surahName').textContent=`${d.arab.englishName} - ${d.arab.name}`;
  document.getElementById('surahMeta').textContent=`${d.arab.englishNameTranslation} - ${d.arab.numberOfAyahs} Ayat`;
  document.getElementById('content').innerHTML=d.arab.ayahs.map((a,i)=>`<div class="verse-card" id="card-${s}-${a.numberInSurah}"><div style="display:flex;justify-content:space-between"><span class="badge">${s}:${a.numberInSurah}</span><button class="btn" onclick="playSingle(${s},${a.numberInSurah})">▶ Play Ini</button></div><div class="arab">${a.text}</div><div class="trans">${d.indo.ayahs[i].text}</div><div style="text-align:center;color:#888;font-size:12px" id="label-${s}-${a.numberInSurah}"></div></div>`).join('');
}

function speakIndo(text){return new Promise(res=>{
  if(document.getElementById('withTrans').value=='0') return res();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='id-ID'; u.rate=parseFloat(document.getElementById('ttsRate').value);
  const voices=speechSynthesis.getVoices(); const v=voices.find(v=>v.lang.startsWith('id'))||voices.find(v=>v.lang.startsWith('ms')); if(v) u.voice=v;
  u.onend=()=>res(); u.onerror=()=>res(); speechSynthesis.speak(u);
  setTimeout(res, Math.min(15000, text.length*90+2000));
});}
function playAudio(src){return new Promise(res=>{const a=document.getElementById('audio'); a.src=src; a.play().catch(()=>res()); a.onended=()=>res(); a.onerror=()=>res();});}

async function playSingle(s,a){ stopAll(); isPlaying=true; await playOneAyat(s,a); isPlaying=false; }

async function playOneAyat(s,a){
  const d=await getSurahData(s);
  // kalau surah di layar beda, tampilkan surah itu
  if(curSurah!=s) await showSurah(s);
  document.querySelectorAll('.verse-card').forEach(c=>c.classList.remove('playing'));
  const card=document.getElementById(`card-${s}-${a}`); if(card){card.classList.add('playing'); card.scrollIntoView({behavior:'smooth',block:'center'});}
  const label=document.getElementById(`label-${s}-${a}`);
  const arabAudio=d.audio.ayahs[a-1].audio; const indoText=d.indo.ayahs[a-1].text;
  const repeat=document.getElementById('loopMode').value=='2'?2:1;
  for(let r=0;r<repeat;r++){
    if(!isPlaying) return;
    if(label) label.textContent=`🔊 Arab ${s}:${a} ${repeat>1?'(ulang '+(r+1)+'/2)':''}`;
    document.getElementById('status').textContent=`🔊 Arab ${s}:${a}`;
    await playAudio(arabAudio); if(!isPlaying) return;
    await new Promise(x=>setTimeout(x,300));
    if(label) label.textContent=`🗣️ Terjemahan Indonesia...`;
    document.getElementById('status').textContent=`🗣️ Terjemahan ${s}:${a}`;
    await speakIndo(indoText); if(!isPlaying) return;
  }
  if(label) label.textContent=`✅ Selesai`;
}

async function startAutoplay(){
  if(isPlaying){stopAll(); return;}
  const queue=buildQueue(); if(!queue.length) return;
  isPlaying=true; document.getElementById('playBtn').textContent='⏸ STOP AUTOPLAY';
  document.getElementById('queueInfo').textContent=`Total ${queue.length} ayat: ${queue[0].s}:${queue[0].a} → ${queue[queue.length-1].s}:${queue[queue.length-1].a} • Pola: Arab → Terjemahan Indonesia → Arab berikutnya...`;
  const loopForever=document.getElementById('loopMode').value=='0';
  do{
    for(let i=0;i<queue.length;i++){
      if(!isPlaying) break;
      document.getElementById('queueInfo').textContent=`Ayat ${i+1}/${queue.length} • ${queue[i].s}:${queue[i].a} • Total ${queue.length} ayat`;
      await playOneAyat(queue[i].s, queue[i].a);
    }
    if(!loopForever) break;
  }while(isPlaying);
  isPlaying=false; document.getElementById('playBtn').textContent='▶ MULAI AUTOPLAY';
  document.getElementById('status').textContent='Selesai';
}

function stopAll(){isPlaying=false; speechSynthesis.cancel(); const a=document.getElementById('audio'); a.pause(); document.getElementById('playBtn').textContent='▶ MULAI AUTOPLAY'; document.getElementById('status').textContent='Dihentikan';}
document.getElementById('qari').onchange=()=>{cache={}; stopAll(); showSurah(curSurah);};
if('speechSynthesis' in window) speechSynthesis.getVoices();
init();
</script></body></html>
