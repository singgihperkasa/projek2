<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recite Quran - 1:3</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui;background:#fff;color:#1a1a1a}
.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:20}
.top-in{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.5px} .logo span{color:#0e7a55}
.logo small{display:block;font-size:11px;font-weight:500;color:#888;letter-spacing:.5px}
.spacer{flex:1}
select,input{padding:9px 10px;border:1px solid #e5e5e5;border-radius:10px;font-size:14px;background:#fafafa;outline:none}
.btn{border:1px solid #e5e5e5;background:#fff;padding:9px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.btn.active{background:#0e7a55;color:#fff;border-color:#0e7a55}
.btn.primary{background:#0e7a55;color:#fff;border-color:#0e7a55}
.wrap{max-width:760px;margin:auto;padding:18px 16px 120px}
.breadcrumb{color:#888;font-size:13px;text-align:center;margin:8px 0 4px}
.surah-title{text-align:center}
.surah-title h1{margin:4px 0;font-size:28px}
.surah-title p{margin:0;color:#888;font-size:14px}
.bismillah{text-align:center;font-family:'Amiri Quran',serif;font-size:32px;margin:22px 0;color:#333}
.verse-card{border:1px solid #eee;border-radius:20px;padding:26px 22px;margin:18px 0;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.04)}
.verse-head{display:flex;justify-content:space-between;align-items:center;color:#888;font-size:13px;margin-bottom:16px}
.verse-head b{color:#0e7a55;background:#eaf6f0;padding:6px 11px;border-radius:999px;font-size:13px}
.arab{font-family:'Amiri Quran',serif;font-size:44px;line-height:1.9;text-align:right;direction:rtl;margin:10px 0}
.arab .w{display:inline-block;margin-left:8px;cursor:pointer;padding:2px 6px;border-radius:8px}
.arab .w:hover,.arab .w.active{background:#eaf6f0;color:#0e7a55}
.translit{text-align:center;font-size:18px;color:#0e7a55;font-weight:600;margin:14px 0;line-height:1.6}
.trans{font-size:17px;line-height:1.7;text-align:center;color:#444}
.wordbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:18px}
.word{border:1px solid #eee;border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#fafafa}
.word:hover{border-color:#0e7a55;background:#fff}
.word .a{font-family:'Amiri Quran',serif;font-size:26px;line-height:1.4}
.word .t{font-size:13px;color:#0e7a55;font-weight:600}
.word .m{font-size:12px;color:#777}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.nav{display:flex;justify-content:space-between;gap:10px;margin:20px 0}
.nav a{flex:1;text-align:center;text-decoration:none;color:#111;border:1px solid #eee;padding:14px;border-radius:14px;font-weight:600}
.nav a:hover{border-color:#0e7a55}
.settings{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.player{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;z-index:30}
.player-in{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.player-in audio{flex:1;height:36px;filter:invert(1)}
.progress{font-size:12px;color:#aaa;white-space:nowrap}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.surah{border:1px solid #eee;padding:12px;border-radius:14px;cursor:pointer}
.surah:hover{border-color:#0e7a55}
.surah b{font-size:14px} .surah span{font-size:12px;color:#888}
@media(max-width:600px){.arab{font-size:34px}.translit{font-size:16px}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="logo">Recite<span>Quran</span><small>READ • LISTEN • LEARN</small></div>
  <div class="spacer"></div>
  <select id="qari" onchange="loadVerse()">
    <option value="ar.alafasy">Mishary Alafasy</option>
    <option value="ar.abdulsamad">AbdulSamad</option>
    <option value="ar.abdulrahmanalsudais">Al-Sudais</option>
    <option value="ar.mahermualaiqly">Maher Al-Muaiqly</option>
  </select>
  <button class="btn" onclick="toggleTheme()">🌙</button>
</div>
<div class="top-in" style="padding-top:0">
  <select id="surahSel" onchange="goSurah(this.value)" style="flex:1"></select>
  <input id="goto" placeholder="Ayat: 1:3" style="width:110px" onkeydown="if(event.key==='Enter') goGoto()">
  <button class="btn primary" onclick="goGoto()">Go →</button>
</div></div>

<div class="wrap">
  <div class="breadcrumb" id="crumb">Surah Al-Fatihah • Ayat 3 dari 7</div>
  <div class="surah-title"><h1 id="surahName">Al-Fatihah • الفاتحة</h1><p id="surahMeta">The Opening • Makki • 7 Ayat • Juz 1</p></div>

  <div class="settings">
    <button class="btn active" id="bArab" onclick="setShow('arab',this)">Arab</button>
    <button class="btn active" id="bTranslit" onclick="setShow('translit',this)">Transliterasi</button>
    <button class="btn active" id="bTrans" onclick="setShow('trans',this)">Terjemahan</button>
    <button class="btn active" id="bWord" onclick="setShow('word',this)">Kata per Kata</button>
    <button class="btn" onclick="changeFont(-2)">A-</button>
    <button class="btn" onclick="changeFont(2)">A+</button>
    <button class="btn" onclick="copyAyat()">📋 Copy</button>
    <button class="btn" onclick="bookmark()">🔖 Bookmark</button>
  </div>

  <div class="bismillah" id="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>

  <div id="content"><p style="text-align:center;padding:40px">Memuat ayat...</p></div>

  <div class="nav">
    <a href="#" id="prevLink" onclick="move(-1);return false">← Ayat Sebelumnya</a>
    <a href="#" id="nextLink" onclick="move(1);return false">Ayat Berikutnya →</a>
  </div>

  <h3 style="margin-top:30px">📖 Semua Surah</h3>
  <input id="search" placeholder="Cari surah... Yasin, Al-Baqarah, 36" style="width:100%" oninput="filterSurah(this.value)">
  <div class="list" id="surahList"></div>
</div>

<div class="player"><div class="player-in">
  <button class="btn primary" id="playBtn" onclick="playCurrent()">▶ Play</button>
  <span class="progress" id="playerLabel">1:3 • Ar-Rahmanir-Rahim</span>
  <audio id="audio" controls></audio>
</div></div>

<script>
let curSurah=1, curAyah=3, fontSize=44, show={arab:true,translit:true,trans:true,word:true};
let allSurah=[], wordData={};

// data kata per kata fallback untuk 1:1-1:7 + umum
const WORDS={
 "1:3":[{a:"ٱلرَّحْمَٰنِ",t:"Ar-Rahmaan",m:"Maha Pengasih"},{a:"ٱلرَّحِيمِ",t:"Ar-Rahiim",m:"Maha Penyayang"}],
 "1:1":[{a:"بِسْمِ",t:"Bismi",m:"Dengan nama"},{a:"ٱللَّهِ",t:"Allaah",m:"Allah"},{a:"ٱلرَّحْمَٰنِ",t:"Ar-Rahmaan",m:"Maha Pengasih"},{a:"ٱلرَّحِيمِ",t:"Ar-Rahiim",m:"Maha Penyayang"}],
 "1:2":[{a:"ٱلْحَمْدُ",t:"Alhamdu",m:"Segala puji"},{a:"لِلَّهِ",t:"Lillaah",m:"bagi Allah"},{a:"رَبِّ",t:"Rabbi",m:"Tuhan"},{a:"ٱلْعَٰلَمِينَ",t:"Al-'Aalamiin",m:"semesta alam"}],
};

async function init(){
  const r=await fetch('https://api.alquran.cloud/v1/surah').then(r=>r.json());
  allSurah=r.data;
  document.getElementById('surahSel').innerHTML=allSurah.map(s=>`<option value="${s.number}" ${s.number==1?'selected':''}>${s.number}. ${s.englishName} - ${s.name}</option>`).join('');
  document.getElementById('surahList').innerHTML=allSurah.map(s=>`<div class="surah" onclick="goSurah(${s.number},1)"><b>${s.number}. ${s.englishName}</b><br><span>${s.englishNameTranslation} • ${s.numberOfAyahs} ayat</span><div style="font-family:'Amiri Quran';font-size:20px;text-align:right">${s.name}</div></div>`).join('');
  // baca dari URL hash #/1:3
  const h=location.hash.replace('#/',''); if(h && h.includes(':')){ const [s,a]=h.split(':'); curSurah=+s; curAyah=+a; document.getElementById('surahSel').value=curSurah; }
  loadVerse();
}
function filterSurah(q){ q=q.toLowerCase(); document.querySelectorAll('.surah').forEach(el=>{ el.style.display=el.textContent.toLowerCase().includes(q)?'block':'none'}) }
function setShow(k,btn){ show[k]=!show[k]; btn.classList.toggle('active',show[k]); loadVerse(); }
function changeFont(d){ fontSize=Math.max(28,Math.min(64,fontSize+d)); loadVerse(); }
function goSurah(s,a=1){ curSurah=+s; curAyah=a; document.getElementById('surahSel').value=s; location.hash=`#/${s}:${a}`; loadVerse(); window.scrollTo({top:0,behavior:'smooth'}) }
function goGoto(){ const v=document.getElementById('goto').value.trim()||'1:3'; const [s,a]=v.split(':'); if(s&&a) goSurah(+s,+a); }
function move(d){ const total=allSurah.find(x=>x.number==curSurah)?.numberOfAyahs||7; let na=curAyah+d; if(na<1){ if(curSurah>1) goSurah(curSurah-1, allSurah.find(x=>x.number==curSurah-1).numberOfAyahs); return; } if(na>total){ if(curSurah<114) goSurah(curSurah+1,1); return; } goSurah(curSurah,na); }

async function loadVerse(){
  const key=`${curSurah}:${curAyah}`;
  document.getElementById('crumb').textContent=`Surah ${allSurah.find(s=>s.number==curSurah)?.englishName||''} • Ayat ${curAyah}`;
  document.getElementById('playerLabel').textContent=`${key} • Surah ${curSurah} Ayat ${curAyah}`;
  document.title=`Recite Quran - ${key}`;
  document.getElementById('bismillah').style.display=(curSurah!=1 && curAyah==1 && curSurah!=9)?'block':'none';
  if(curSurah==1) document.getElementById('bismillah').style.display='none';
  const [arab, indo, translit, audio] = await Promise.all([
    fetch(`https://api.alquran.cloud/v1/ayah/${key}`).then(r=>r.json()),
    fetch(`https://api.alquran.cloud/v1/ayah/${key}/id.indonesian`).then(r=>r.json()),
    fetch(`https://api.alquran.cloud/v1/ayah/${key}/en.transliteration`).then(r=>r.json()),
    fetch(`https://api.alquran.cloud/v1/ayah/${key}/${document.getElementById('qari').value}`).then(r=>r.json())
  ]);
  const surah=allSurah.find(s=>s.number==curSurah);
  document.getElementById('surahName').textContent=`${surah.englishName} • ${surah.name}`;
  document.getElementById('surahMeta').textContent=`${surah.englishNameTranslation} • ${surah.revelationType} • ${surah.numberOfAyahs} Ayat`;
  const words=WORDS[key]||arab.data.text.split(' ').map(w=>({a:w,t:'',m:''}));
  let html=`<div class="verse-card">
    <div class="verse-head"><b>${key}</b><span>Juz ${arab.data.juz} • Hal ${arab.data.page} • ${surah.revelationType}</span></div>
    ${show.arab?`<div class="arab" id="arabText" style="font-size:${fontSize}px">${words.map((w,i)=>`<span class="w" onclick="speakWord(this)">${w.a}</span>`).join(' ')} <span style="color:#0e7a55">﴿${toArabicNum(curAyah)}﴾</span></div>`:''}
    ${show.translit?`<div class="translit">${translit.data.text}</div>`:''}
    ${show.trans?`<div class="trans">${indo.data.text} <br><small style="color:#999">— Kemenag RI</small></div>`:''}
    ${show.word?`<div class="wordbox">${words.map(w=>`<div class="word"><div class="a">${w.a}</div><div class="t">${w.t}</div><div class="m">${w.m}</div></div>`).join('')}</div>`:''}
    <div class="actions">
      <button class="btn primary" onclick="playCurrent()">▶ Dengarkan</button>
      <button class="btn" onclick="repeatAyat()">🔁 Ulangi</button>
      <button class="btn" onclick="copyAyat()">📋 Salin</button>
    </div>
  </div>`;
  document.getElementById('content').innerHTML=html;
  document.getElementById('prevLink').textContent=`← ${curAyah>1?curSurah+':'+(curAyah-1):'Surah Sebelumnya'}`;
  document.getElementById('nextLink').textContent=`${curAyah<surah.numberOfAyahs?curSurah+':'+(curAyah+1):'Surah Berikutnya'} →`;
  const aud=document.getElementById('audio'); aud.src=audio.data.audio; aud.dataset.repeat='0';
}
function toArabicNum(n){ return String(n).replace(/\d/g,d=> '٠١٢٣٤٥٦٧٨٩'[d]); }
function playCurrent(){ const a=document.getElementById('audio'); a.play(); document.getElementById('playBtn').textContent='⏸ Pause'; a.onpause=()=>document.getElementById('playBtn').textContent='▶ Play'; }
function repeatAyat(){ const a=document.getElementById('audio'); a.loop=true; a.play(); }
function speakWord(el){ document.querySelectorAll('.w').forEach(x=>x.classList.remove('active')); el.classList.add('active'); playCurrent(); }
async function copyAyat(){ const t=document.getElementById('content').innerText; await navigator.clipboard.writeText(t+`\n\n— Quran ${curSurah}:${curAyah} via ReciteQuran`); alert('Ayat tersalin!'); }
function bookmark(){ localStorage.setItem('lastRead',`${curSurah}:${curAyah}`); alert('Bookmark tersimpan: '+curSurah+':'+curAyah); }
function toggleTheme(){ document.body.style.background=document.body.style.background=='#111'?'#fff':'#111'; document.body.style.color=document.body.style.color=='#fff'?'#1a1a1a':'#fff'; }
init();
</script>
</body>
</html>
